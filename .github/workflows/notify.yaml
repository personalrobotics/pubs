name: Notify the sites

# When master changes, tell the sites that build from this repository, so they
# rebuild now rather than at their daily backstop:
#
# - siddhss5/siddhss5.github.io (goodrobot.ai) moves its data/pubs submodule to
#   master and redeploys on `pubs-updated`.
# - siddhss5/sidd-cv rebuilds its mentoring tables from people.yaml on
#   `yaml-updated`. (It picks up the .bib files with its own daily sync.)
#
# Each needs a fine-grained PAT with Contents: write on the target repository,
# stored here as SITE_REPO_PAT and CV_REPO_PAT. Sending the dispatch is all
# each job does, so a missing or expired token fails that job loudly.

on:
  push:
    branches:
      - master
    paths:
      - '*.bib'
      - 'people.yaml'
      - 'projects.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
    - name: Tell goodrobot.ai to update
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.SITE_REPO_PAT }}
        repository: siddhss5/siddhss5.github.io
        event-type: pubs-updated
        client-payload: '{"sha": "${{ github.sha }}"}'

  cv:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # Compared with the commit before the push, not HEAD^, so a push of several
    # commits is seen whole.
    - name: Did people.yaml change?
      id: people
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git diff --quiet "$BEFORE" HEAD -- people.yaml; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Tell the CV to rebuild
      if: steps.people.outputs.changed == 'true'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.CV_REPO_PAT }}
        repository: siddhss5/sidd-cv
        event-type: yaml-updated
        client-payload: '{"sha": "${{ github.sha }}"}'
